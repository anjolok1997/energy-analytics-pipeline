# Two targets, same models:
#   dev  -> local DuckDB file (no setup; also what CI uses)
#   prod -> Postgres (what Metabase reads)
# Models are plain SQL and run unchanged on both. A BigQuery target would be a
# third block here, no model changes.

energy_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../warehouse.duckdb"
      threads: 4

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'energy') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'energy') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'energy') }}"
      schema: "analytics"
      threads: 4

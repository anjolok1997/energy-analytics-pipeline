# Re-run the whole pipeline on demand. The OWID source only refreshes ~annually,
# so there's no cron here — kick it off manually from the Actions tab when the
# upstream dataset publishes a new release.

name: refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (core only)
        run: |
          pip install pandas requests SQLAlchemy duckdb duckdb-engine \
                      dbt-core dbt-duckdb

      - name: Run pipeline
        env:
          AI_BACKEND: template
        run: |
          python ingest/load_energy_data.py
          cd dbt && dbt build --profiles-dir . && cd ..
          python ingest/ai_enrich.py

# Postgres warehouse + Metabase.
#   docker compose up -d
#   Postgres  -> localhost:5432  (energy / energy / energy)
#   Metabase  -> http://localhost:3000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mbdata:/metabase-data

volumes:
  pgdata:
  mbdata:
